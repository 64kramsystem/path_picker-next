name: path_picker-next

on:
  push:
    paths:
      - ".github/workflows/path_picker-next.yml"
      - "path_picker-next/**"
  pull_request:
    paths:
      - ".github/workflows/path_picker-next.yml"
      - "path_picker-next/**"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    defaults:
      run:
        working-directory: path_picker-next

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: path_picker-next/requirements.txt
      - run: pip install --upgrade autopep8
      - run: pip install -r requirements.txt
      - run: ./scripts/buildAndTest.sh

  all-tests:
    name: All Python tests passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check test results
        run: |
          [[ "${{ needs.test.result }}" == "success" ]] || exit 1
